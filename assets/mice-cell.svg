    <clipPath id="cell-mouse-crop">
      <rect width="224" height="190" />
    </clipPath>
  </defs>
  <g id="cell-mouse-body" fill="#ffffff" stroke="#b61a51" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#cell-mouse-crop)">
    <path id="cell-mouse-torso" d="M140 102 C161 111 185 132 193 147 C187 160 176 171 175 187 L164 204 L105 204 C102 181 102 160 104 145 Z" />
    <g id="mascot-ears">
      <path id="mascot-ear-left" d="M68 64 C62 48 52 31 39 31 C25 28 15 49 16 69 C17 90 34 105 58 100 L63 82 Z" />
      <path id="mascot-ear-left-fold" d="M40 32 C52 34 58 51 61 75 C58 82 57 88 58 94 C43 100 26 92 20 85" fill="none" stroke-width="2.475" />
      <path id="mascot-ear-right" d="M121 54 C129 32 140 12 155 16 C170 20 179 42 178 59 C178 77 160 89 143 84 L132 69 Z" />
      <path id="mascot-ear-right-fold" d="M149 17 C137 22 133 43 131 58 C137 65 141 72 143 79 C157 83 172 74 177 63" fill="none" stroke-width="2.475" />
    </g>
    <path id="mascot-head" d="M67 64 C83 49 101 43 121 54 C124 42 135 23 146 18 C137 27 133 45 131 58 C142 71 146 85 143 99 C140 111 132 128 124 140 C118 149 111 151 103 147 C91 141 82 131 73 122 C59 108 53 94 58 80 C61 68 60 62 57 49 C60 54 64 59 67 64 Z" />
    <g id="mascot-face">
      <ellipse id="mascot-eye-left" cx="83.5" cy="95" rx="4.3" ry="8" fill="#b61a51" stroke="none" />
      <ellipse id="mascot-eye-right" cx="118" cy="89" rx="4.3" ry="8" transform="rotate(-13 118 89)" fill="#b61a51" stroke="none" />
      <ellipse id="mascot-nose" cx="108" cy="138" rx="11" ry="7.2" stroke-width="2.85" />
      <path id="mascot-whiskers" d="M88 140 L63 151 M91 144 L74 165 M130 131 L158 130 M127 136 L154 147" fill="none" stroke="#b61a51" stroke-width="2.55" />
    </g>
  </g>
  <path id="cell-mouse-edge" d="M0 190 H224" fill="none" stroke="#d7dce1" stroke-width="1" vector-effect="non-scaling-stroke" />
  <g id="cell-mouse-paws" fill="#ffffff" stroke="#b61a51" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <g id="cell-mouse-paw-left" transform="translate(105 190) rotate(-8)">
      <ellipse rx="10.2" ry="15.5" />
      <path d="M-4 7 L-4 14 M2 6 L2 15" fill="none" stroke-width="2.4" />
    </g>
    <g id="cell-mouse-paw-right" transform="translate(171 190) rotate(8)">
      <ellipse rx="9.2" ry="15.5" />
      <path d="M-4 7 L-4 14 M2 6 L2 15" fill="none" stroke-width="2.4" />
    </g>
  </g>
</svg>
