<svg xmlns="http://www.w3.org/2000/svg" width="224" height="214" viewBox="0 0 224 214" role="img" aria-labelledby="cell-mouse-title cell-mouse-desc">
  <title id="cell-mouse-title">Мышь держится за нижнюю границу ячейки</title>
  <desc id="cell-mouse-desc">Поза персонажа курса без кольца. Мордочка и уши взяты из mice-mascot.svg, перерисованного по стикеру mice авторства Jaden M. Walters: https://amices.org/mice/. Горизонтальная опора и центры лапок находятся на y=190; нижние 24 единицы выходят за границу ячейки. Контур 3.6 единицы и детали имеют цвет пропусков #B61A51.</desc>
